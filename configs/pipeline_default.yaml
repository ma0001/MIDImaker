# =============================================================================
# MIDImaker ステム分離 ＆ MIDI自動生成パイプライン (推奨デフォルト設定)
#
# フロー:
# 1. 元音源からドラム特化モデル (kuielab_a_drums) でドラムWAVを直接抽出
# 2. 元音源からベース特化モデル (kuielab_a_bass) でベースWAVを直接抽出
# 3. 元音源から高精度モデル (bs-roformer-inst) で Vocals WAV を抽出
# 4. 元音源から Demucs 6s (htdemucs_6s) でピアノ・ギター・その他 (piano, guitar, other) WAV を一括抽出
# 5. 分離された Vocals に対して De-Echo / De-Reverb を適用し、ドライボーカル (vocals_dry) を作成
# 6. 元音源からテンポマップ解析を行い、独立したテンポMIDI (_tempo.mid) を出力
# 7. Step 6 のテンポMIDIを同期元にして、ドラムWAVからドラムMIDI (_drums.mid) を生成
# 8. Step 6 のテンポMIDIを同期元にして、ベースWAVからベースMIDI (_bass.mid) を生成
# 9. Step 6 のテンポMIDIを同期元にして、ピアノWAVからペダル付きピアノMIDI (_piano.mid) を生成
#    ※ 連打抑制デバウンスフィルターにより、エコーや残響の跳ね返りによるゴーストノートを自動マージ除去
# =============================================================================

# 出力フォーマット (WAV / FLAC / MP3 など。デフォルト: WAV)
output_format: "WAV"

# サンプリングレート
sample_rate: 44100

# 中間生成ファイル（作業ディレクトリ内の一時ファイル）を削除するか (true: 保持, false: 削除)
keep_intermediates: false

# 共通モデル定義ファイルのパス (省略時は configs/models.yaml を自動検索)
models_config: "configs/models.yaml"

# エイリアス定義
aliases:
  drums-kuielab: "kuielab_a_drums.onnx"
  bass-kuielab: "kuielab_a_bass.onnx"
  bs-roformer-inst: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
  demucs-6s: "htdemucs_6s.yaml"
  dereverb-echo: "dereverb-echo_mel_band_roformer_sdr_13.4843_v2.ckpt"

steps:
  # ---------------------------------------------------------------------------
  # Step 1: ドラム特化モデルによるドラム抽出 (元音源から直接抽出)
  # ---------------------------------------------------------------------------
  - name: "drums"
    type: "separate"
    model: "drums-kuielab"
    input: "input"
    target_stems: ["drums"]
    output_name: "{basename}_drums"

  # ---------------------------------------------------------------------------
  # Step 2: ベース特化モデルによるベース抽出 (元音源から直接抽出)
  # ---------------------------------------------------------------------------
  - name: "bass"
    type: "separate"
    model: "bass-kuielab"
    input: "input"
    target_stems: ["bass"]
    output_name: "{basename}_bass"

  # ---------------------------------------------------------------------------
  # Step 3: 最高精度のボーカル抽出 (BS-Roformer)
  # ---------------------------------------------------------------------------
  - name: "vocal_sep"
    type: "separate"
    model: "bs-roformer-inst"
    input: "input"
    target_stems: ["vocals"]
    output_name: "{basename}_vocals"

  # ---------------------------------------------------------------------------
  # Step 4: ピアノ・ギター・その他抽出 (Demucs 6s)
  # ※ 4ステム版(demucs-ft)の other にはピアノやギターが含まれて重複するため、
  #    6ステム版(demucs-6s)から piano, guitar, other を一括抽出して重複を防ぎます。
  # ---------------------------------------------------------------------------
  - name: "demucs_6s"
    type: "separate"
    model: "demucs-6s"
    input: "input"
    target_stems: ["piano", "guitar", "other"]
    output_name: "{basename}_{stem}"

  # ---------------------------------------------------------------------------
  # Step 5: ボーカルのみに De-Echo / De-Reverb を適用（完全ドライボーカル化）
  # ---------------------------------------------------------------------------
  - name: "vocal_dereverb"
    type: "separate"
    model: "dereverb-echo"
    input: "vocal_sep.vocals"  # Step 3 で抽出されたボーカルを入力！
    target_stems: ["dry"]
    output_name: "{basename}_vocals_dry"

  # ---------------------------------------------------------------------------
  # Step 6: テンポ解析＆テンポトラックMIDI生成 (Essentia)
  # ---------------------------------------------------------------------------
  - name: "tempo_track"
    type: "tempo_midi"
    input: "input"             # 元音源から高精度にビート・テンポマップを解析
    output_name: "{basename}_tempo.mid"

  # ---------------------------------------------------------------------------
  # Step 7: ドラムWAVからドラムMIDIを生成 (Step 6 のテンポファイルを同期元に入力！)
  # ---------------------------------------------------------------------------
  - name: "drums_midi"
    type: "drums_midi"
    input: "drums.drums"       # Step 1 で分離されたドラムWAVを入力！
    output_name: "{basename}_drums.mid"
    tempo: "tempo_track"       # 👈 Step 6 で出力されたテンポMIDIファイルを指定！

  # ---------------------------------------------------------------------------
  # Step 8: ベースWAVからベースMIDIを生成 (Step 6 のテンポファイルを同期元に入力！)
  # ---------------------------------------------------------------------------
  - name: "bass_midi"
    type: "bass_midi"
    input: "bass.bass"         # Step 2 で分離されたベースWAVを入力！
    output_name: "{basename}_bass.mid"
    tempo: "tempo_track"       # 👈 Step 6 で出力されたテンポMIDIファイルを指定！

  # ---------------------------------------------------------------------------
  # Step 9: ピアノWAVからピアノMIDIを生成 (Step 6 のテンポファイルを同期元に入力！)
  # ---------------------------------------------------------------------------
  - name: "piano_midi"
    type: "piano_midi"
    input: "demucs_6s.piano"   # Step 4 で分離されたピアノWAVを入力！
    output_name: "{basename}_piano.mid"
    tempo: "tempo_track"       # 👈 Step 6 で出力されたテンポMIDIファイルを指定！
    onset_threshold: 0.40      # アタック感度 (0.40で分離ノイズの拾いすぎを抑制)
    min_volume_db: -40.0       # ノイズゲート閾値 (微弱な残響・ゴーストノートを除外)
    debounce_ms: 120           # 連打抑制フィルター (120ms以内のエコー跳ね返り重複ノートを自動タイ結合)
    filter_semitone: true      # 半音衝突抑制 (短2度不協和音ゴーストノートを自動消去)
    min_duration_ms: 40        # 極短ノイズ除去 (40ms未満の打撃ノイズやチリチリ音を除外)
    min_velocity: 25           # 微弱ゴースト除去 (ベロシティ25未満の極小ノートを除外)


